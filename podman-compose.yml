# Punto App — stack completo (ADR-004)
# Uso: podman-compose up --build
#
# Servicios:
#   db     PostgreSQL 16 (ECR Public) — datos en bind mount local ./.data/postgres
#   api    FastAPI REST en http://localhost:8000 (hot-reload activado)
#          GET /health → estado completo (incluye conexión a DB)
#          GET /healthz → liveness puro
#   web    Storefront SvelteKit en http://localhost:3000
#   admin  Panel SvelteKit    en http://localhost:3001
#
# Imágenes base desde public.ecr.aws (nunca Docker Hub).

# Persistencia de datos (decisión de infraestructura):
#
# El bind mount hacia ./.data/postgres NO es viable cuando el proyecto
# vive en /mnt/d (disco NTFS vía drvfs de WSL): ese filesystem no soporta
# chown POSIX y initdb falla con EPERM sin importar los flags (:U incluido).
#
# Solución: volumen NOMBRADO gestionado por Podman (almacenamiento Linux
# nativo, permisos correctos siempre). Se declara EXTERNAL para que
# `podman-compose down -v` NO lo elimine: la persistencia del punto de
# venta queda garantizada aunque se tire todo el stack.

services:
  db:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-punto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-punto}
      POSTGRES_DB: ${POSTGRES_DB:-punto}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-punto} -d ${POSTGRES_DB:-punto}"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://punto:punto@db:5432/punto}
      JWT_SECRET_STORE: ${JWT_SECRET_STORE:-change-me-store}
      JWT_SECRET_ADMIN: ${JWT_SECRET_ADMIN:-change-me-admin}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      VISIT_DEDUP_WINDOW_HOURS: ${VISIT_DEDUP_WINDOW_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      ADMIN_INITIAL_USER: ${ADMIN_INITIAL_USER:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      ADMIN_INITIAL_DISPLAY_NAME: ${ADMIN_INITIAL_DISPLAY_NAME:-}
    volumes:
      - ./backend:/app   # hot-reload: cambios de código sin rebuild
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "3000:3000"

  admin:
    build: ./admin
    ports:
      - "3001:3000"

volumes:
  pgdata:
    # external=true: no es propiedad de este compose → `down -v` no la borra.
    # Crearla una sola vez:  podman volume create punto_pgdata
    external: true
    name: punto_pgdata
